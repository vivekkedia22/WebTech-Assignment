<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Sign Up - Simon Game</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>

<body>
  <header>
  <img src="public/images/vitap_logo.jpeg" alt="logo" class="logo">
  </header>
  <div class="page-content">
    <div class="auth-page">
      <div class="auth-container">
      <h1>Simon Game</h1>
      <h2>Sign Up</h2>
      <form id="signupForm">
        <input type="text" id="signupName" placeholder="Full Name" required minlength="2">
        <input type="text" id="signupUsername" placeholder="Username" required minlength="3" pattern="[a-zA-Z0-9_]+">
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="text" id="signupPhone" placeholder="Phone Number" required pattern="[0-9]{10,15}" maxlength="15">
        <div class="password-container">
          <input type="password" id="signupPassword" placeholder="Password" required minlength="6">
          <span class="toggle-password" onclick="togglePassword('signupPassword')">👁️</span>
        </div>
        <div class="password-container">
          <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required minlength="6">
          <span class="toggle-password" onclick="togglePassword('signupConfirmPassword')">👁️</span>
        </div>
        <span id="signup-error" class="error-msg"></span>
        <button type="submit">Sign Up</button>
      </form>
      <p class="switch-form">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  </div>
  <footer>
  <img src="public/images/vitap_logo.jpeg" alt="logo" class="logo">
  </footer>

  <script src="auth.js"></script>
</body>

</html>
